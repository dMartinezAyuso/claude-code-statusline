name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "If this is a **security** problem, do not use this form: use the private advisory (see the Security tab)."
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you expected and what you see instead. If you can, paste a screenshot **without links from the bar** (they carry the token).
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `./statusline.sh --doctor`
      render: text
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: System and terminal
      placeholder: macOS 15, iTerm2 3.5
    validations: { required: true }
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      placeholder: output of `claude --version`
