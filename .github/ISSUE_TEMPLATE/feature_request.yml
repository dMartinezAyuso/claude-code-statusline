name: Propuesta
description: Una mejora o una función nueva
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema quieres resolver
    validations: { required: true }
  - type: textarea
    id: propuesta
    attributes:
      label: Cómo lo harías
    validations: { required: true }
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que has considerado
