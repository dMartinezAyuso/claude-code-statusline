name: Feature request
description: An improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: How would you do it
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
