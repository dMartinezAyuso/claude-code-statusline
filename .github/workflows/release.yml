name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear la release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: El tag coincide con VERSION y CHANGELOG
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Pruebas
        run: |
          sudo apt-get install -y jq
          python3 -m unittest discover -s tests
          bash tests/test_statusline.sh
      - name: Notas desde CHANGELOG
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > NOTAS.md
      - name: Paquete
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="claude-code-statusline-${GITHUB_REF_NAME#v}/" -o "dist/claude-code-statusline-${GITHUB_REF_NAME#v}.tar.gz" HEAD
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file NOTAS.md --verify-tag
